<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국어 문법 퀘스트 - 말하면서 배우는 교실</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@400;700&display=swap');
        
        :root {
            --primary: #6366F1;
            --primary-gradient: linear-gradient(135deg, #6366F1 0%, #A855F7 100%);
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --accent: #F43F5E;
            --success: #10B981;
        }

        body {
            font-family: 'Jua', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #EEF2FF 0%, #FCE7F3 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            background: var(--card-bg);
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 4px solid #FFFFFF;
            position: relative;
        }

        /* 상단 상태 바 */
        .status-bar {
            background: var(--primary-gradient);
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stage-badge {
            background: rgba(255, 255, 255, 0.25);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            backdrop-filter: blur(4px);
        }

        .btn-stage-select {
            background: rgba(255, 255, 255, 0.25);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 14px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
        }

        .btn-stage-select:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .progress-panel {
            padding: 9px 20px 7px;
            background: #FFFFFF;
            border-bottom: 1px solid #E2E8F0;
        }
        .progress-top {
            display: flex; justify-content: space-between; align-items: center;
            gap: 8px; font-size: 0.78rem; color: #475569; margin-bottom: 5px;
        }
        .progress-title { font-weight: bold; color: #334155; }
        .progress-count { color: #6366F1; font-weight: bold; }
        .progress-track { height: 9px; background: #E2E8F0; border-radius: 99px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #6366F1 0%, #A855F7 100%); border-radius: 99px; transition: width 0.35s ease; }
        .progress-stats { display: flex; justify-content: space-between; margin-top: 5px; font-size: 0.72rem; color: #64748B; }
        .progress-stats strong { color: #334155; }
        .achievement-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0 10px; }
        .achievement-card { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; padding: 7px 5px; text-align: center; }
        .achievement-number { font-size: 1.05rem; font-weight: bold; color: #4F46E5; }
        .achievement-label { font-size: 0.68rem; color: #64748B; margin-top: 1px; }

        /* 캐릭터 & 말풍선 영역 */
        .character-section {
            background: linear-gradient(180deg, #F5F3FF 0%, #FFFFFF 100%);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px dashed #E2E8F0;
        }

        .mascot-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            object-position: top;
            border: 2px solid var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            flex-shrink: 0;
            background: #fff;
        }

        .speech-bubble {
            background: #FFFFFF;
            padding: 8px 12px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            font-size: 0.85rem;
            line-height: 1.35;
            position: relative;
            flex-grow: 1;
            border: 2px solid #E0E7FF;
        }

        /* 미션 콘텐츠 영역 */
        .content-area {
            padding: 10px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }

        .hint-box {
            background: #EEF2FF;
            color: #3730A3;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            border: 1px solid #C7D2FE;
            line-height: 1.35;
        }

        .hint-icon {
            font-size: 1rem;
            flex-shrink: 0;
        }

        .question-card {
            background: #F8FAFC;
            padding: 10px;
            border-radius: 16px;
            font-size: 1.05rem;
            line-height: 1.4;
            border: 2px solid #E2E8F0;
            text-align: center;
            font-weight: bold;
        }

        /* 이미지 컨테이너 대폭 확대 (높이 200px, object-fit: contain) */
        .visual-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 4px 0;
            background: #F8FAFC;
            border-radius: 16px;
            padding: 8px;
            border: 3px solid #E2E8F0;
            height: 200px;
            overflow: hidden;
            position: relative;
        }

        .visual-container img {
            width: 100%;
            height: 190px;
            object-fit: contain;
            border-radius: 10px;
            background: #FFFFFF;
        }

        .target-word {
            color: var(--primary);
            background: #EEF2FF;
            padding: 2px 6px;
            border-radius: 6px;
            display: inline-block;
            margin: 2px 0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-label {
            font-size: 0.85rem;
            color: #64748B;
            display: flex;
            justify-content: space-between;
        }

        textarea {
            width: 100%;
            height: 60px;
            padding: 10px;
            border: 2px solid #CBD5E1;
            border-radius: 14px;
            font-size: 0.95rem;
            font-family: inherit;
            resize: none;
            box-sizing: border-box;
            background: #FAFAFA;
            transition: all 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .feedback-box {
            padding: 10px;
            border-radius: 12px;
            background: #ECFDF5;
            color: #065F46;
            border: 2px solid #A7F3D0;
            display: none;
            font-size: 0.88rem;
            line-height: 1.35;
        }

        /* 하단 액션 버튼 영역 */
        .action-area {
            padding: 10px 20px 14px 20px;
            background: #FFFFFF;
            border-top: 2px solid #F1F5F9;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        }

        .btn-record {
            background: #FEE2E2;
            color: #DC2626;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 2px solid #FECACA;
        }

        .btn-record.recording {
            background: #DC2626;
            color: white;
            animation: pulseRecord 1s infinite;
        }

        .btn-submit {
            background: var(--primary-gradient);
            color: white;
            flex: 1.4;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
        }

        button:active {
            transform: scale(0.96);
            box-shadow: none;
        }

        /* 팝업 모달 스타일 */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
        }

        .modal-card {
            background: white;
            width: 100%;
            max-width: 380px;
            max-height: 90vh;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 3px solid #E0E7FF;
            display: flex;
            flex-direction: column;
        }

        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .modal-subtitle {
            font-size: 0.85rem;
            color: #64748B;
            margin-bottom: 12px;
        }

        .report-scroll-area {
            flex-grow: 1;
            max-height: 300px;
            overflow-y: auto;
            border: 2px solid #E2E8F0;
            border-radius: 14px;
            padding: 10px;
            background: #F8FAFC;
            text-align: left;
            margin-bottom: 14px;
        }

        .report-item {
            background: #FFFFFF;
            padding: 8px 10px;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid #E2E8F0;
            font-size: 0.88rem;
            line-height: 1.4;
        }

        .report-item-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .stage-select-btn {
            width: 100%;
            background: #FFFFFF;
            border: 2px solid #C7D2FE;
            color: #3730A3;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: none;
        }

        .stage-select-btn:hover {
            background: #EEF2FF;
            border-color: var(--primary);
        }

        .btn-next-stage {
            background: var(--primary-gradient);
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 16px;
            font-size: 1.05rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
            flex-shrink: 0;
        }

        @keyframes pulseRecord {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            display: none;
        }
        /* 휴대폰용 최적화 */
        @media (max-width: 600px) {
            html, body {
                width: 100%;
                min-height: 100%;
                overflow-x: hidden;
            }

            body {
                min-height: 100dvh;
                align-items: stretch;
            }

            .game-container {
                width: 100%;
                max-width: none;
                height: 100dvh;
                max-height: none;
                min-height: 0;
                border: 0;
                border-radius: 0;
                box-shadow: none;
            }

            .status-bar {
                padding: 10px 12px;
                font-size: 0.9rem;
            }

            .stage-badge {
                padding: 5px 9px;
                font-size: 0.8rem;
            }

            .btn-stage-select {
                min-height: 42px;
                padding: 7px 10px;
                font-size: 0.82rem;
            }

            .progress-panel {
                padding: 8px 12px 7px;
            }

            .progress-top {
                font-size: 0.76rem;
            }

            .character-section {
                padding: 8px 12px;
                gap: 9px;
            }

            .mascot-img {
                width: 40px;
                height: 40px;
            }

            .speech-bubble {
                padding: 7px 10px;
                font-size: 0.82rem;
            }

            .content-area {
                padding: 9px 12px 12px;
                gap: 7px;
                -webkit-overflow-scrolling: touch;
            }

            .hint-box {
                padding: 8px 10px;
                font-size: 0.82rem;
            }

            .question-card {
                padding: 10px 8px;
                font-size: 1.02rem;
            }

            .visual-container {
                height: 150px;
                min-height: 150px;
                padding: 6px;
                margin: 2px 0;
            }

            .visual-container img {
                height: 140px;
            }

            textarea {
                height: 68px;
                min-height: 68px;
                padding: 11px;
                font-size: 16px;
            }

            button, .stage-select-btn {
                min-height: 44px;
                touch-action: manipulation;
                -webkit-tap-highlight-color: transparent;
            }

            .btn-record, .btn-submit {
                min-height: 48px;
                font-size: 1rem;
            }

            .btn-next-stage {
                min-height: 48px;
                padding: 10px 12px;
                font-size: 1rem;
            }

            .modal-card {
                max-width: calc(100vw - 24px);
                max-height: 88dvh;
            }
        }

        @media (max-width: 360px) {
            .status-bar { padding: 8px 10px; }
            .progress-panel { padding-left: 10px; padding-right: 10px; }
            .content-area { padding-left: 10px; padding-right: 10px; }
            .question-card { font-size: 0.96rem; }
            .visual-container { height: 125px; min-height: 125px; }
            .visual-container img { height: 115px; }
        }

    </style>
</head>
<body>

<div class="game-container">
    <canvas id="confetti-canvas"></canvas>

    <!-- 스테이지 클리어 피드백 팝업 모달 -->
    <div class="modal-overlay" id="clear-modal">
        <div class="modal-card">
            <div style="font-size: 2rem; margin-bottom: 2px;">🏆</div>
            <div class="modal-title" id="modal-stage-title">STAGE 1 클리어!</div>
            <div class="modal-subtitle">이 화면을 캡처해서 선생님께 보내주세요! 📸</div>
            
            <div class="report-scroll-area" id="modal-report-list"></div>

            <button class="btn-next-stage" onclick="proceedNextStage()">
                다음 단계로 이동하기 🚀
            </button>
        </div>
    </div>

    <!-- 단계 선택 팝업 모달 -->
    <div class="modal-overlay" id="stage-select-modal">
        <div class="modal-card">
            <div style="font-size: 2rem; margin-bottom: 2px;">🗺️</div>
            <div class="modal-title">단계 선택하기</div>
            <div class="modal-subtitle">복습하고 싶은 스테이지를 선택하세요!</div>
            
            <div class="report-scroll-area" id="stage-select-list"></div>

            <button class="btn-next-stage" onclick="closeStageSelect()" style="background: #94A3B8; box-shadow: none;">
                닫기 ❌
            </button>
        </div>
    </div>

    <!-- 상단 상태 바 -->
    <div class="status-bar">
        <div class="status-left">
            <span id="stage-indicator" class="stage-badge">STAGE 1 (시작 인사)</span>
            <button class="btn-stage-select" onclick="openStageSelect()">단계 선택 🗺️</button>
        </div>
        <span id="score">⭐ 0점</span>
    </div>

    <div class="progress-panel">
        <div class="progress-top">
            <span id="progress-title" class="progress-title">스테이지 진행</span>
            <span id="progress-count" class="progress-count">0 / 0</span>
        </div>
        <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        <div class="progress-stats">
            <span>클리어 <strong id="clear-count">0</strong></span>
            <span>재도전 대기 <strong id="wrong-count">0</strong></span>
            <span>이번 스테이지 <strong id="stage-score">0점</strong></span>
        </div>
    </div>

    <!-- 캐릭터 & 말풍선 -->
    <div class="character-section">
        <img src="data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22120%22%20height%3D%22120%22%3E%3Crect%20width%3D%22120%22%20height%3D%22120%22%20rx%3D%2260%22%20fill%3D%22%236366f1%22%2F%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2248%22%20r%3D%2228%22%20fill%3D%22%23ffd166%22%2F%3E%3Cpath%20d%3D%22M36%2042%20Q60%2018%2084%2042%22%20fill%3D%22%23222%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2248%22%20r%3D%223%22%2F%3E%3Ccircle%20cx%3D%2270%22%20cy%3D%2248%22%20r%3D%223%22%2F%3E%3Cpath%20d%3D%22M50%2061%20Q60%2069%2070%2061%22%20fill%3D%22none%22%20stroke%3D%22%23333%22%20stroke-width%3D%223%22%2F%3E%3C%2Fsvg%3E" alt="마스코트" class="mascot-img" id="mascot-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'60\' height=\'60\'><circle cx=\'30\' cy=\'30\' r=\'30\' fill=\'%236366F1\'/><text x=\'30\' y=\'38\' font-size=\'24\' text-anchor=\'middle\' fill=\'white\'>👦</text></svg>'">
        <div class="speech-bubble" id="mascot-speech">
            안녕하세요? 처음 뵙겠습니다.
        </div>
    </div>

    <!-- 미션 콘텐츠 -->
    <div class="content-area">
        <div class="hint-box">
            <div class="hint-icon">💡</div>
            <div id="hint-text"><b>[보기]</b> 인사를 나누어 보세요.</div>
        </div>

        <div class="question-card" id="question-text">
            인사해 보세요.<br>
            (제시어: <span class='target-word'>안녕하세요, 반갑습니다</span>)
        </div>

        <div id="visual-area"></div>

        <div class="input-group">
            <div class="input-label">
              <span>🎤 음성 녹음 또는 직접 입력</span>
              <span id="mic-status" style="color: #4F46E5; font-weight: bold;">대기 중</span>
            </div>
            <textarea id="user-input" placeholder="주변 소음을 줄이고 또렷하게 말씀하세요! 충분히 생각한 뒤 [정답 확인]을 누르세요."></textarea>
        </div>

        <div class="feedback-box" id="feedback-area">
            🎉 <b>정답 확인 완료! (+100점)</b><br>
            💡 <b>입력 내용 확인 후 다음으로 진행합니다.</b>
        </div>
    </div>

    <!-- 하단 액션 버튼 -->
    <div class="action-area">
        <button class="btn-record" id="record-btn" onclick="toggleRecord()">
            🎤 음성 녹음 시작
        </button>
        <button class="btn-submit" onclick="submitAnswer()">
            정답 확인 ✨
        </button>
    </div>
</div>

<script>
    function generateBTemplate(count) {
        const templates = [
            { q: "이 가방은 어때요?<br>(제시어: <span class='target-word'>가볍다</span>)", required: ["가벼워요", ["가벼워", "가볍"]] },
            { q: "날씨가 어때요?<br>(제시어: <span class='target-word'>춥다</span>)", required: ["추워요", ["추워", "춥"]] },
            { q: "이 책은 어때요?<br>(제시어: <span class='target-word'>어렵다</span>)", required: ["어려워요", ["어려워", "어렵"]] },
            { q: "한국 음식이 어때요?<br>(제시어: <span class='target-word'>맵다</span>)", required: ["매워요", ["매워", "맵"]] },
            { q: "이 옷은 어때요?<br>(제시어: <span class='target-word'>예쁘다</span>)", required: ["예뻐요", ["예뻐", "예쁘"]] },
            { q: "이 신발은 어때요?<br>(제시어: <span class='target-word'>가볍다</span>)", required: ["가벼워요", ["가벼워", "가볍"]] },
            { q: "오늘 날씨가 어때요?<br>(제시어: <span class='target-word'>덥다</span>)", required: ["더워요", ["더워", "덥"]] },

        'building.jpg': 'data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22700%22%20height%3D%22360%22%3E%3Crect%20width%3D%22700%22%20height%3D%22360%22%20fill%3D%22%23e0f2fe%22%2F%3E%3Crect%20x%3D%22210%22%20y%3D%2245%22%20width%3D%22280%22%20height%3D%22260%22%20fill%3D%22%23f8fafc%22%20stroke%3D%22%2364748b%22%20stroke-width%3D%225%22%2F%3E%3Ctext%20x%3D%22350%22%20y%3D%2285%22%20text-anchor%3D%22middle%22%20font-size%3D%2225%22%20font-weight%3D%22bold%22%3E%EB%B3%91%EC%9B%90%3C%2Ftext%3E%3Crect%20x%3D%22245%22%20y%3D%22105%22%20width%3D%2270%22%20height%3D%2265%22%20fill%3D%22%23bfdbfe%22%2F%3E%3Crect%20x%3D%22385%22%20y%3D%22105%22%20width%3D%2270%22%20height%3D%2265%22%20fill%3D%22%23bfdbfe%22%2F%3E%3Crect%20x%3D%22245%22%20y%3D%22195%22%20width%3D%2270%22%20height%3D%2265%22%20fill%3D%22%23bfdbfe%22%2F%3E%3Crect%20x%3D%22385%22%20y%3D%22195%22%20width%3D%2270%22%20height%3D%2265%22%20fill%3D%22%23bfdbfe%22%2F%3E%3Ctext%20x%3D%22350%22%20y%3D%22335%22%20text-anchor%3D%22middle%22%20font-size%3D%2224%22%3E2%EC%B8%B5%20%EB%B3%91%EC%9B%90%20%C2%B7%201%EC%B8%B5%20%EC%95%BD%EA%B5%AD%3C%2Ftext%3E%3C%2Fsvg%3E'
    };
    function assetImage(name) { return ASSET_IMAGES[name] || name; }
    function setMascot(name) {
        const el = document.getElementById('mascot-img');
        if (el) el.src = assetImage(name);
    }

    let currentStageIndex = 0;
    let currentQIndex = 0;
    let isGreetingStep = true; 
    let score = 0;
    let stageScore = 0;
    let stageResults = []; 
    let firstRoundClearCount = 0;
    let retrySuccessCount = 0;
    let unresolvedCount = 0;
    let wrongAttempts = 0;
    let currentStageWrongQueue = []; 
    let isRetryMode = false;         
    let retryAttemptCount = 0;       
    let recognition = null;
    let isRecording = false;
    let finalTranscript = '';
    let isAnswerProcessing = false;

    function createSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return null;
        try {
            const r = new SpeechRecognition();
            r.lang = 'ko-KR';
            r.continuous = false;
            r.interimResults = true;
            r.maxAlternatives = 1;
            r.onstart = function() {
                isRecording = true;
                const btn = document.getElementById('record-btn');
                const status = document.getElementById('mic-status');
                if (btn) { btn.classList.add('recording'); btn.innerHTML = '⏹️ 녹음 완료 (멈추기)'; }
                if (status) status.innerText = '🔴 듣는 중... (말씀하세요)';
            };
            r.onresult = function(event) {
                let text = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    text += event.results[i][0].transcript + ' ';
                }
                const clean = (finalTranscript + text).replace(/[?？]/g, '').trim();
                document.getElementById('user-input').value = clean;
                if (event.results[event.results.length - 1].isFinal) finalTranscript = clean + ' ';
            };
            r.onerror = function(event) {
                console.error('음성 인식 오류:', event.error);
                const status = document.getElementById('mic-status');
                const messages = {
                    'not-allowed': '마이크 권한이 차단되었습니다. 주소창 왼쪽 사이트 설정에서 마이크를 허용해 주세요.',
                    'service-not-allowed': '이 브라우저에서 음성 인식 서비스가 차단되었습니다. Chrome에서 다시 시도해 주세요.',
                    'audio-capture': '마이크를 찾을 수 없습니다. 마이크 연결과 권한을 확인해 주세요.',
                    'no-speech': '음성이 들리지 않았어요. 다시 눌러서 천천히 말해 보세요.'
                };
                if (status) status.innerText = messages[event.error] || '음성 인식을 사용할 수 없습니다. 아래 입력창에 직접 입력해 주세요.';
                isRecording = false;
                const btn = document.getElementById('record-btn');
                if (btn) { btn.classList.remove('recording'); btn.innerHTML = '🎤 음성 녹음 시작'; }
            };
            r.onend = function() {
                if (isRecording) stopRecordUI(false);
            };
            return r;
        } catch (e) {
            console.error('음성 인식 초기화 실패:', e);
            return null;
        }
    }

    function initSpeechRecognition() {
        recognition = createSpeechRecognition();
    }

    function toggleRecord() {
        const btn = document.getElementById('record-btn');
        const status = document.getElementById('mic-status');
        if (!('SpeechRecognition' in window) && !('webkitSpeechRecognition' in window)) {
            if (status) status.innerText = '이 브라우저에서는 음성 인식을 지원하지 않습니다. Chrome에서 사용하거나 직접 입력해 주세요.';
            return;
        }
        if (isRecording) {
            stopRecordUI(true);
            return;
        }
        finalTranscript = '';
        if (document.getElementById('user-input').value) {
            finalTranscript = document.getElementById('user-input').value + ' ';
        }
        recognition = createSpeechRecognition();
        if (!recognition) {
            if (status) status.innerText = '음성 인식을 시작할 수 없습니다. 직접 입력해 주세요.';
            return;
        }
        try {
            recognition.start();
        } catch (e) {
            console.error('음성 인식 시작 실패:', e);
            isRecording = false;
            if (btn) { btn.classList.remove('recording'); btn.innerHTML = '🎤 음성 녹음 시작'; }
            if (status) status.innerText = '음성 인식을 시작할 수 없습니다. Chrome의 마이크 권한을 확인해 주세요.';
        }
    }

    function stopRecordUI(callStop=true) {
        isRecording = false;
        if (callStop && recognition) {
            try { recognition.stop(); } catch(e) {}
        }
        const btn = document.getElementById('record-btn');
        const status = document.getElementById('mic-status');
        if (btn) { btn.classList.remove('recording'); btn.innerHTML = '🎤 음성 녹음 시작'; }
        if (status && status.innerText.indexOf('마이크') < 0 && status.innerText.indexOf('지원하지') < 0) status.innerText = '대기 중';
    }

    function openStageSelect() {
        let listHtml = '';
        stages.forEach((s, idx) => {
            listHtml += `
                <button class="stage-select-btn" onclick="jumpToStage(${idx})">
                    <b>${s.stage}</b>: ${s.grammarTitle}
                </button>
            `;
        });
        document.getElementById('stage-select-list').innerHTML = listHtml;
        document.getElementById('stage-select-modal').style.display = 'flex';
    }

    function closeStageSelect() {
        document.getElementById('stage-select-modal').style.display = 'none';
    }

    function jumpToStage(idx) {
        closeStageSelect();
        currentStageIndex = idx;
        currentQIndex = 0;
        isGreetingStep = (idx === 0);
        stageResults = [];
        stageScore = 0;
        firstRoundClearCount = 0;
        retrySuccessCount = 0;
        unresolvedCount = 0;
        wrongAttempts = 0;
        currentStageWrongQueue = [];
        isRetryMode = false;
        retryAttemptCount = 0;
        updateStageUI();
    }

    function getCurrentQuestionList() {
        const stageObj = stages[currentStageIndex];
        if (isRetryMode) return currentStageWrongQueue;
        return stageObj.questions;
    }

    function updateProgressUI() {
        const stageObj = stages[currentStageIndex];
        const normalTotal = stageObj.questions.length;
        const progressTitle = document.getElementById('progress-title');
        const progressCount = document.getElementById('progress-count');
        const progressFill = document.getElementById('progress-fill');
        if (!progressTitle) return;

        if (currentStageIndex === 0 && isGreetingStep) {
            progressTitle.innerText = '시작 인사';
            progressCount.innerText = '준비';
            progressFill.style.width = '0%';
        } else if (isRetryMode) {
            progressTitle.innerText = '오답 다시 도전';
            progressCount.innerText = `${Math.min(currentQIndex + 1, currentStageWrongQueue.length)} / ${currentStageWrongQueue.length}`;
            progressFill.style.width = `${normalTotal ? (firstRoundClearCount / normalTotal) * 100 : 0}%`;
        } else {
            progressTitle.innerText = '스테이지 진행';
            progressCount.innerText = `${Math.min(currentQIndex + 1, normalTotal)} / ${normalTotal}`;
            progressFill.style.width = `${normalTotal ? (Math.min(currentQIndex, normalTotal) / normalTotal) * 100 : 0}%`;
        }

        document.getElementById('clear-count').innerText = firstRoundClearCount + retrySuccessCount;
        document.getElementById('wrong-count').innerText = currentStageWrongQueue.length;
        document.getElementById('stage-score').innerText = `${stageScore}점`;
    }

    function updateStageUI() {
        const stageObj = stages[currentStageIndex];
        const visualArea = document.getElementById('visual-area');
        visualArea.innerHTML = ''; 

        if (currentStageIndex === 0 && isGreetingStep) {
            document.getElementById('stage-indicator').innerText = `STAGE 1 (시작 인사)`;
            document.getElementById('mascot-speech').innerText = "안녕하세요? 처음 뵙겠습니다.";
            document.getElementById('hint-text').innerHTML = "<b>[인사]</b> 첫 인사를 나누어 보세요.";
            document.getElementById('question-text').innerHTML = `인사해 보세요.<br>(제시어: <span class='target-word'>안녕하세요, 반갑습니다</span>)`;
        } else {
            let qList = getCurrentQuestionList();
            let totalQ = qList.length;
            let badgeText = isRetryMode ? `${stageObj.stage} (오답 재도전 ${retryAttemptCount}/2)` : stageObj.stage;
            
            document.getElementById('stage-indicator').innerText = `${badgeText} (${currentQIndex + 1}/${totalQ})`;
            document.getElementById('mascot-speech').innerText = stageObj.mascotSpeech;
            document.getElementById('hint-text').innerHTML = stageObj.hint;
            
            const currentQ = qList[currentQIndex];
            document.getElementById('question-text').innerHTML = currentQ.q;

            if (currentQ.img) {
                let style = "width: 100%; height: 190px; object-fit: contain; border-radius: 10px; background: #FFF;";
                visualArea.innerHTML = `<div class="visual-container"><img src="${assetImage(currentQ.img)}" alt="문제 이미지" style="${style}"></div>`;
            }
        }
        
        finalTranscript = '';
        document.getElementById('user-input').value = '';
        document.getElementById('feedback-area').style.display = 'none';
        stopRecordUI();
        updateProgressUI();
    }

    function submitAnswer() {
        if (isAnswerProcessing) return;
        isAnswerProcessing = true;
        let inputVal = document.getElementById('user-input').value.trim();
        const feedbackBox = document.getElementById('feedback-area');
        
        if (!inputVal) {
            alert("답변을 말씀하시거나 텍스트로 입력해주세요!");
            isAnswerProcessing = false;
            return;
        }

        stopRecordUI();
        inputVal = inputVal.replace(/[?？?]/g, '').trim();

        if (currentStageIndex === 0 && isGreetingStep) {
            let greetingMatched = ["안녕하세요", "반갑습니다"].every(keyword => inputVal.includes(keyword));
            if (!greetingMatched) {
                setMascot('hint.png');
                feedbackBox.style.display = 'block';
                feedbackBox.style.background = '#FEE2E2';
                feedbackBox.style.color = '#991B1B';
                feedbackBox.style.borderColor = '#FECACA';
                feedbackBox.innerHTML = `❌ <b>인사말을 확인해보세요!</b><br>💬 <b>입력 내용:</b> "${inputVal}"<br>💡 "안녕하세요? 만나서 반갑습니다."라고 인사해보세요.`;
                isAnswerProcessing = false;
                return;
            }

            isGreetingStep = false;
            setMascot('success.png');
            feedbackBox.style.display = 'block';
            feedbackBox.style.background = '#ECFDF5';
            feedbackBox.style.color = '#065F46';
            feedbackBox.style.borderColor = '#A7F3D0';
            feedbackBox.innerHTML = `🎉 <b>반갑습니다! 본격적인 퀘스트를 시작합니다.</b>`;
            triggerConfetti();

            setTimeout(() => {
                setMascot('hint.png');
                updateStageUI();
            }, 2000);
            return;
        }

        if (inputVal.includes("저가")) {
            wrongAttempts++;
            setMascot('hint.png');
            feedbackBox.style.display = 'block';
            feedbackBox.style.background = '#FEE2E2';
            feedbackBox.style.color = '#991B1B';
            feedbackBox.style.borderColor = '#FECACA';
            document.getElementById('user-input').value = '';
            finalTranscript = '';
            feedbackBox.innerHTML = `❌ <b>대명사 오류!</b><br>💬 <b>입력 내용:</b> "${inputVal}"<br>💡 '저가'는 틀린 말이에요! <b>'제가'</b> 또는 <b>'저는'</b>을 사용해 주세요.`;
            isAnswerProcessing = false;
            return;
        }

        let qList = getCurrentQuestionList();
        const currentQ = qList[currentQIndex];
        
        let matched = true;
        let customErrorMsg = "";

        if (currentStageIndex === 0 && inputVal.includes("입니다")) {
            matched = false;
            customErrorMsg = "'입니다'는 격식체예요. 비격식체인 '이에요'를 사용해 주세요!";
        }

        if (currentStageIndex === 2 && inputVal.includes("사어요")) {
            matched = false;
            customErrorMsg = "'사다'의 올바른 형태는 '사요'예요!";
        }

        // STAGE 3.5 2번: 한국 생활 + 한국어 공부를 다양한 자연스러운 문장으로 허용
        // 예: "나는 한국에서 한국어 공부를 해요."
        //     "저는 한국에 살아요. 한국어 공부를 해요."
        //     "저는 한국에 한국어 공부를 하러 왔어요."
        //     "저는 한국이 좋아요. 한국어 공부를 해요."
        if (currentStageIndex === 2 && currentQIndex === 1) {
            const hasKorea = inputVal.includes("한국");
            const hasStudy = inputVal.includes("공부");
            if (hasKorea && hasStudy) {
                matched = true;
            } else {
                matched = false;
                customErrorMsg = "'한국'과 '한국어 공부'를 넣어서 자연스럽게 말해보세요.";
            }
        }

        if (currentStageIndex === 1) {
            // STAGE 2: 대답 안에서 지시사를 섞어 쓰지 않도록 한다.
            // 예: "이것은 지우개가 아니에요. 그것은 필통이에요." → 오답
            //     "이것은 지우개가 아니에요. 이것은 필통이에요." → 정답 후보
            const hasIgeoseun = inputVal.includes("이것은");
            const hasGeugeoseun = inputVal.includes("그것은");
            if (hasIgeoseun && hasGeugeoseun) {
                matched = false;
                customErrorMsg = "대답에서는 지시사를 하나로 통일해 주세요. <b>'이것은'</b>을 사용했다면 끝까지 '이것은', <b>'그것은'</b>을 사용했다면 끝까지 '그것은'으로 말해 주세요.";
            } else if (currentQ.qDemo === "그것은" && hasGeugeoseun) {
                matched = false;
                customErrorMsg = "'그것은'으로 물었을 때는 화자 기준인 <b>'이것은'</b>으로 대답해야 해요!";
            }
        }

        if (currentStageIndex === 6 && currentQ.forbidden) {
            if (currentQ.forbidden.some(f => inputVal.includes(f))) {
                matched = false;
                customErrorMsg = "지갑의 위치를 표현할 때는 '가방과 가방 사이' 형태로 정확히 표현해보세요.";
            }
        }

        if (currentStageIndex === 7 && currentQ.type === "birthday") {
            if (inputVal.includes("육월")) {
                matched = false;
                customErrorMsg = "6월은 '육월'이 아니라 반드시 <b>'유월'</b>로 읽어야 해요!";
            } else if (inputVal.includes("십월")) {
                matched = false;
                customErrorMsg = "10월은 '십월'이 아니라 반드시 <b>'시월'</b>로 읽어야 해요!";
            } else if (inputVal.includes("하나월") || inputVal.includes("둘월") || inputVal.includes("셋월")) {
                matched = false;
                customErrorMsg = "월을 읽을 때는 한자어 수(일, 이, 삼...)를 사용해야 해요!";
            }
        }

        if (currentStageIndex === 7 && currentQIndex === 2 && inputVal.includes("저는")) {
            matched = false;
            customErrorMsg = "질문이 '누가 사미르예요?'이므로 <b>'제가 사미르예요'</b>로 대답해야 해요!";
        }

        if (currentQ.particleType && !inputVal.includes(currentQ.particleType)) {
            matched = false;
            customErrorMsg = `장소에 맞는 '${'${currentQ.particleType}'}' 조사를 사용해 주세요.`;
        }

        if (currentQ.forbidden && currentQ.forbidden.some(f => inputVal.includes(f))) {
            matched = false;
        }

        function matchesRequirement(requirement) {
            if (Array.isArray(requirement)) {
                // 한 단계 배열: 여러 표현 중 하나를 허용
                // 중첩 배열: 각 조건 묶음을 모두 만족해야 함
                if (requirement.some(item => Array.isArray(item))) {
                    return requirement.every(item => matchesRequirement(item));
                }
                return requirement.some(alt => inputVal.includes(alt));
            }
            return inputVal.includes(requirement);
        }

        if (matched) {
            matched = currentQ.required.every(matchesRequirement);
        }

        if (!matched) {
            setMascot('hint.png');
            feedbackBox.style.display = 'block';
            feedbackBox.style.background = '#FEF3C7';
            feedbackBox.style.color = '#92400E';
            feedbackBox.style.borderColor = '#FDE68A';

            document.getElementById('user-input').value = '';
            finalTranscript = '';

            if (!isRetryMode) {
                // 일반 문제: 문제마다 최대 3번까지 연속으로 도전한다.
                // 1회 또는 2회 틀린 뒤 3회 안에 맞히면 즉시 클리어(100점).
                // 3회 모두 틀린 경우에만 오답 목록에 넣고 다음 문제로 넘어간다.
                retryAttemptCount++;

                if (retryAttemptCount < 3) {
                    feedbackBox.innerHTML = `🌱 <b>조금 아쉬워요!</b><br>한 번 더 생각해서 다시 말해보세요. (도전 ${retryAttemptCount}/3회)`;
                    isAnswerProcessing = false;
                    return;
                }

                // 정확히 3회 모두 틀린 문제만 스테이지 마지막 재도전 목록에 추가
                if (!currentStageWrongQueue.includes(currentQ)) {
                    currentStageWrongQueue.push(currentQ);
                }

                feedbackBox.innerHTML = `📌 <b>3번 모두 틀렸어요.</b><br>스테이지 마지막에 다시 풀 수 있어요. (마지막 재도전 기회 2회)`;
                retryAttemptCount = 0;
                updateProgressUI();
                setTimeout(() => {
                    isAnswerProcessing = false;
                    advanceQuestion();
                }, 2000);
                return;
            } else {
                retryAttemptCount++;
                if (retryAttemptCount < 2) {
                    feedbackBox.innerHTML = `💪 <b>다시 한번 생각해볼까요? (재도전 ${retryAttemptCount}/2회)</b><br>💡 ${customErrorMsg || '핵심 키워드를 넣어서 다시 말해보세요!'}`;
                    isAnswerProcessing = false;
                    return;
                } else {
                    let correctDesc = Array.isArray(currentQ.required[0]) ? (Array.isArray(currentQ.required[0][0]) ? currentQ.required[0][0].join(' ') : currentQ.required[0][0]) : currentQ.required[0];
                    feedbackBox.innerHTML = `📚 <b>아쉽네요! 정답은 [ ${correctDesc} ... ] 입니다. (0점)</b><br>💡 정답을 확인하고 다음으로 넘어갑니다.`;
                    
                    stageResults.push({
                        qNum: `재도전-${currentQIndex + 1}`,
                        ox: "❌ 재도전 실패(0점)",
                        userAnswer: inputVal,
                        comment: "재도전 2회를 모두 소진하여 정답을 학습하고 넘어갔습니다."
                    });
                    unresolvedCount++;

                    retryAttemptCount = 0;
                    updateProgressUI();
                    setTimeout(() => {
                        isAnswerProcessing = false;
                        advanceRetryQuestion();
                    }, 3500);
                    return;
                }
            }
        }

        const wasRetryMode = isRetryMode;
        let earnedScore = wasRetryMode ? 50 : 100;
        score += earnedScore;
        stageScore += earnedScore;
        if (wasRetryMode) { retrySuccessCount++; }
        else { firstRoundClearCount++; }
        document.getElementById('score').innerText = `⭐ ${score}점`;
        updateProgressUI();

        stageResults.push({
            qNum: wasRetryMode ? `재도전-${currentQIndex + 1}` : currentQIndex + 1,
            ox: wasRetryMode ? "⭕ 재도전 성공(50점)" : "⭕ 정답(100점)",
            userAnswer: inputVal,
            comment: "정확하게 잘 표현했어요! ✨"
        });

        wrongAttempts = 0;
        if (!wasRetryMode) isRetryMode = false;
        setMascot('success.png');
        feedbackBox.style.display = 'block';
        feedbackBox.style.background = '#ECFDF5';
        feedbackBox.style.color = '#065F46';
        feedbackBox.style.borderColor = '#A7F3D0';
        feedbackBox.innerHTML = `🎉 <b>정답입니다! (+${earnedScore}점)</b><br>💬 <b>내가 말한 내용:</b> "${inputVal}"<br>✨ 아주 잘했어요!`;
        
        triggerConfetti();

        setTimeout(() => {
            setMascot('hint.png');
            isAnswerProcessing = false;
            if (wasRetryMode) {
                advanceRetryQuestion();
            } else {
                advanceQuestion();
            }
        }, 2000);
    }

    function advanceQuestion() {
        currentQIndex++;
        const stageObj = stages[currentStageIndex];
        let normalQuestions = stageObj.questions;
        
        if (currentQIndex < normalQuestions.length) {
            updateStageUI();
        } else {
            if (currentStageWrongQueue.length > 0) {
                isRetryMode = true;
                currentQIndex = 0;
                retryAttemptCount = 0;
                alert(`💪 모든 문제를 다 풀었어요!\n이제 아쉽게 틀렸던 문제들을 다시 한번 도전해볼까요? (재도전 기회 2번)`);
                updateStageUI();
            } else {
                showClearModal();
            }
        }
    }

    function advanceRetryQuestion() {
        currentQIndex++;
        retryAttemptCount = 0;
        if (currentQIndex < currentStageWrongQueue.length) {
            updateStageUI();
        } else {
            showClearModal();
        }
    }

    function showClearModal() {
        const stageObj = stages[currentStageIndex];
        document.getElementById('modal-stage-title').innerText = `${stageObj.stage} 클리어! 🎉`;
        
        let reportHtml = `
            <div class="achievement-summary">
                <div class="achievement-card"><div class="achievement-number">${firstRoundClearCount}</div><div class="achievement-label">3회 안 클리어</div></div>
                <div class="achievement-card"><div class="achievement-number">${retrySuccessCount}</div><div class="achievement-label">재도전 성공</div></div>
                <div class="achievement-card"><div class="achievement-number">${unresolvedCount}</div><div class="achievement-label">다시 공부할 문제</div></div>
            </div>
            <div class="report-item" style="text-align:center; background:#EEF2FF; border-color:#C7D2FE;">
                <b>이번 스테이지 ${stageScore}점</b><br>
                <span style="color:#64748B; font-size:0.82rem;">누적 점수 ${score}점</span>
            </div>`;
        if (stageResults.length === 0) {
            reportHtml += `<div class="report-item" style="text-align: center; color: #10B981; font-weight: bold;">모든 문제를 한 번에 맞혔습니다! 완벽해요! 🌟</div>`;
        } else {
            stageResults.forEach(res => {
                reportHtml += `
                    <div class="report-item">
                        <div class="report-item-header">
                            <span><b>[문항 ${res.qNum}]</b></span>
                            <span style="color: ${res.ox.includes('정답') || res.ox.includes('성공') ? '#10B981' : '#F43F5E'};"><b>${res.ox}</b></span>
                        </div>
                        <div style="color: #334155; margin-top: 2px;">💬 답변: "${res.userAnswer}"</div>
                        <div style="color: #64748B; font-size: 0.8rem; margin-top: 2px;">💡 피드백: ${res.comment}</div>
                    </div>
                `;
            });
        }

        document.getElementById('modal-report-list').innerHTML = reportHtml;
        document.getElementById('clear-modal').style.display = 'flex';
    }

    function proceedNextStage() {
        document.getElementById('clear-modal').style.display = 'none';
        
        currentStageIndex++;
        if (currentStageIndex >= stages.length) {
            alert("🏆 축하합니다! 모든 1~8단계 대장정을 완벽하게 클리어했습니다!");
            currentStageIndex = 0;
            isGreetingStep = true;
            score = 0;
            stageScore = 0;
        }

        currentQIndex = 0;
        stageResults = []; 
        stageScore = 0;
        firstRoundClearCount = 0;
        retrySuccessCount = 0;
        unresolvedCount = 0;
        wrongAttempts = 0;
        currentStageWrongQueue = [];
        isRetryMode = false;
        retryAttemptCount = 0;
        updateStageUI();
    }

    function triggerConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.style.display = 'block';
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;

        let particles = [];
        const colors = ['#6366F1', '#A855F7', '#F43F5E', '#10B981', '#F59E0B'];

        for (let i = 0; i < 50; i++) {
            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 2,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8 - 3,
                size: Math.random() * 8 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                alpha: 1
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.alpha -= 0.02;

                ctx.save();
                ctx.globalAlpha = Math.max(p.alpha, 0);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });

            if (particles.length > 0) {
                requestAnimationFrame(animate);
            } else {
                canvas.style.display = 'none';
            }
        }
        animate();
    }

    initSpeechRecognition();
    updateStageUI();
</script>

</body>

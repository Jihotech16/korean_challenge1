<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 - 한국어 문법 퀘스트</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@400;700&display=swap');
        :root {
            --primary: #6366F1;
            --primary-gradient: linear-gradient(135deg, #6366F1 0%, #A855F7 100%);
            --bg: #EEF2FF;
            --card: #FFFFFF;
            --text: #1E293B;
            --muted: #64748B;
            --line: #E2E8F0;
            --danger: #F43F5E;
            --ok: #10B981;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Nunito', 'Apple SD Gothic Neo', sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        h1, h2, h3, .brand { font-family: 'Jua', sans-serif; }
        button, input, textarea, select { font-family: inherit; }

        .gate {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .gate-card, .panel {
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 16px 40px rgba(99,102,241,0.12);
        }
        .gate-card {
            width: 100%;
            max-width: 380px;
            padding: 28px 24px;
            text-align: center;
        }
        .gate-card h1 { margin: 0 0 8px; }
        .gate-card p { color: var(--muted); margin: 0 0 18px; }
        .app { display: none; min-height: 100vh; }
        .top {
            background: var(--primary-gradient);
            color: white;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .top a { color: white; text-decoration: none; }
        .admin-level-tabs {
            display: flex;
            gap: 6px;
            flex: 1;
            justify-content: center;
        }
        .admin-level-tab {
            border: 0;
            border-radius: 999px;
            padding: 8px 14px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            background: rgba(255,255,255,0.18);
            color: white;
        }
        .admin-level-tab.active {
            background: white;
            color: #4338CA;
        }
        .wrap {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 16px;
            padding: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .panel { padding: 16px; }
        .stage-item, .q-item {
            width: 100%;
            text-align: left;
            border: 1px solid var(--line);
            background: white;
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .stage-item.active, .q-item.active {
            border-color: var(--primary);
            background: #EEF2FF;
        }
        .muted { color: var(--muted); font-size: 0.85rem; }
        label { display: block; font-weight: 700; margin: 12px 0 6px; font-size: 0.9rem; }
        input, textarea, select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 16px;
        }
        textarea { min-height: 88px; resize: vertical; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .btn {
            border: 0;
            border-radius: 12px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 700;
            background: var(--primary-gradient);
            color: white;
        }
        .btn.gray { background: #94A3B8; }
        .btn.red { background: var(--danger); }
        .btn.ok { background: var(--ok); }
        .status {
            margin-top: 10px;
            font-size: 0.88rem;
            color: var(--muted);
        }
        .help {
            background: #F8FAFC;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 0.82rem;
            color: var(--muted);
            line-height: 1.45;
        }
        .preview-box {
            background: #F5F3FF;
            border: 1px dashed #C4B5FD;
            border-radius: 14px;
            padding: 12px 14px;
            font-family: 'Jua', sans-serif;
            line-height: 1.5;
        }
        .target-word {
            background: #FEF3C7;
            color: #B45309;
            padding: 1px 6px;
            border-radius: 8px;
        }
        details.advanced {
            margin-top: 16px;
            background: #F8FAFC;
            border-radius: 14px;
            padding: 10px 12px;
        }
        details.advanced summary {
            cursor: pointer;
            font-weight: 700;
            color: #475569;
        }
        .img-preview {
            margin-top: 8px;
            max-width: 240px;
            max-height: 160px;
            border-radius: 12px;
            background: #fff;
            object-fit: contain;
            display: none;
        }
        .img-preview.show { display: block; }
        @media (max-width: 800px) {
            .wrap { grid-template-columns: 1fr; padding: 12px; }
        }
    </style>
</head>
<body>
<div class="gate" id="gate">
    <div class="gate-card">
        <div class="brand">관리자 로그인</div>
        <h1>문제 편집</h1>
        <p>학생 화면이 아닙니다. 선생님만 들어가 주세요.</p>
        <input id="password" type="password" placeholder="관리자 비밀번호">
        <div class="row" style="justify-content:center;">
            <button class="btn" onclick="login()">들어가기</button>
        </div>
        <div class="status" id="login-status"></div>
    </div>
</div>

<div class="app" id="app">
    <div class="top">
        <div class="brand">문제 관리자</div>
        <div class="admin-level-tabs">
            <button class="admin-level-tab active" id="admin-tab-beginner" onclick="setAdminLevel('beginner')">🌱 초급</button>
            <button class="admin-level-tab" id="admin-tab-intermediate" onclick="setAdminLevel('intermediate')">🌿 중급</button>
            <button class="admin-level-tab" id="admin-tab-advanced" onclick="setAdminLevel('advanced')">🌳 고급</button>
        </div>
        <div>
            <a href="index.html">게임으로</a>
            &nbsp;|&nbsp;
            <a href="#" onclick="logout(); return false;">로그아웃</a>
        </div>
    </div>
    <div class="wrap">
        <div class="panel">
            <h2 id="stage-list-title">초급 스테이지</h2>
            <div id="stage-list"></div>
            <div class="row">
                <button class="btn" onclick="addStage()">이 난이도에 스테이지 추가</button>
            </div>
        </div>
        <div class="panel">
            <h2 id="editor-title">스테이지 편집</h2>
            <div id="stage-editor"></div>
        </div>
    </div>
    <div class="wrap" style="grid-template-columns:1fr;">
        <div class="panel">
            <h2>저장</h2>
            <p class="help">
                <b>이 기기 미리보기</b>는 선생님 휴대폰/컴퓨터에서만 바로 반영됩니다.<br>
                학생들에게 보이게 하려면 <b>GitHub에 게시</b>를 누르면 됩니다. 관리자 비밀번호만 있으면 됩니다.
            </p>
            <div class="row">
                <button class="btn ok" onclick="saveLocal()">이 기기에서 미리보기 저장</button>
                <button class="btn gray" onclick="clearLocal()">미리보기 지우기</button>
                <button class="btn gray" onclick="downloadJSON()">JSON 내려받기</button>
                <button class="btn" onclick="publishGitHub()">GitHub에 게시</button>
            </div>
            <div class="status" id="save-status"></div>
        </div>
    </div>
</div>

<script>
    const ADMIN_PASSWORD = 'korean2026';
    const IMAGE_OPTIONS = [
        '', 'hint.png', 'success.png', 'classroom.jpg', 'building.jpg',
        'clock_class.png', 'clock_dinner.png', 'clock_apt.png',
        'image_4eb4ef.jpg', 'image_4eb870.jpg', 'image_4eb8eb.jpg', 'image_4eb966.jpg',
        'image_4ebc53.jpg', 'image_4ebccb.jpg', 'image_5e96a4.png'
    ];
    const extraImages = [];
    const localImagePreview = {};

    let stages = [];
    let currentStage = 0;
    let currentQuestion = 0;
    let currentAdminLevel = 'beginner';

    function login() {
        const value = document.getElementById('password').value;
        const status = document.getElementById('login-status');
        if (value !== ADMIN_PASSWORD) {
            status.innerText = '비밀번호가 올바르지 않습니다.';
            return;
        }
        sessionStorage.setItem('koreanQuestAdmin', '1');
        sessionStorage.setItem('koreanQuestAdminPw', value);
        openApp();
    }

    function logout() {
        sessionStorage.removeItem('koreanQuestAdmin');
        sessionStorage.removeItem('koreanQuestAdminPw');
        location.reload();
    }

    async function openApp() {
        document.getElementById('gate').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        await loadQuestions();
        renderAll();
    }

    async function loadQuestions() {
        const local = localStorage.getItem('koreanQuestQuestions');
        if (local) {
            stages = JSON.parse(local);
            setSaveStatus('이 기기에 저장된 미리보기 문제를 불러왔습니다.');
        } else {
            const res = await fetch('questions.json?t=' + Date.now());
            stages = await res.json();
            setSaveStatus('현재 공개된 문제를 불러왔습니다.');
        }
        stages.forEach(function(stage) {
            if (!stage.level) stage.level = 'beginner';
        });
        setAdminLevel(currentAdminLevel || 'beginner', true);
    }

    function stagesOfLevel(level) {
        return stages.map(function(stage, index) {
            return { stage: stage, index: index };
        }).filter(function(item) {
            return stageLevelOf(item.stage) === level;
        });
    }

    function stageLevelOf(stage) {
        const value = stage && stage.level;
        if (value === '중급' || value === 'intermediate') return 'intermediate';
        if (value === '고급' || value === 'advanced') return 'advanced';
        return 'beginner';
    }

    function setAdminLevel(level, keepIndex) {
        saveStageMeta(true);
        saveQuestion(true);
        currentAdminLevel = level;
        ['beginner', 'intermediate', 'advanced'].forEach(function(id) {
            const tab = document.getElementById('admin-tab-' + id);
            if (tab) tab.classList.toggle('active', id === level);
        });
        const title = document.getElementById('stage-list-title');
        if (title) title.innerText = levelLabel(level) + ' 스테이지';
        const list = stagesOfLevel(level);
        if (!keepIndex || stageLevelOf(stages[currentStage] || {}) !== level) {
            currentStage = list.length ? list[0].index : -1;
            currentQuestion = 0;
        }
        renderAll();
    }

    function renderAll() {
        renderStageList();
        renderEditor();
    }

    function renderStageList() {
        const list = document.getElementById('stage-list');
        const filtered = stagesOfLevel(currentAdminLevel);
        if (!filtered.length) {
            list.innerHTML = '<p class="muted">이 난이도 스테이지가 아직 없습니다. 아래에서 추가해 주세요.</p>';
            return;
        }
        list.innerHTML = filtered.map(function(item) {
            return `
            <button class="stage-item ${item.index === currentStage ? 'active' : ''}" onclick="selectStage(${item.index})">
                <b>${escapeHtml(item.stage.stage || ('STAGE ' + (item.index + 1)))}</b><br>
                <span class="muted">${escapeHtml(item.stage.grammarTitle || '')} · 문제 ${item.stage.questions.length}개</span>
            </button>
        `;
        }).join('');
    }

    function selectStage(index) {
        currentStage = index;
        currentQuestion = 0;
        renderAll();
    }

    function addStage() {
        const count = stagesOfLevel(currentAdminLevel).length;
        stages.push({
            stage: levelLabel(currentAdminLevel) + ' ' + (count + 1),
            level: currentAdminLevel,
            grammarTitle: '새 문법',
            mascotSpeech: '새 스테이지를 시작해봐요!',
            hint: buildHint('힌트를 적어 주세요.'),
            questions: [blankQuestion()]
        });
        currentStage = stages.length - 1;
        currentQuestion = 0;
        renderAll();
    }

    function blankQuestion() {
        return { q: buildQuestionHtml('새 문제', '제시어'), required: [] };
    }

    function decodeHtml(value) {
        const box = document.createElement('textarea');
        box.innerHTML = String(value || '');
        return box.value;
    }

    function parseQuestionHtml(q) {
        const raw = String(q || '');
        const promptMatch = raw.match(/제시어:\s*<span[^>]*>([\s\S]*?)<\/span>/i);
        const prompts = promptMatch ? decodeHtml(promptMatch[1]).replace(/\s+/g, ' ').trim() : '';
        let title = raw.replace(/<br\s*\/?>\s*\(?\s*제시어:[\s\S]*$/i, '');
        title = title
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/<\/?b>/gi, '')
            .replace(/<[^>]+>/g, '')
            .replace(/&nbsp;/g, ' ');
        return {
            title: decodeHtml(title).trim(),
            prompts
        };
    }

    function buildQuestionHtml(title, prompts) {
        const safeTitle = escapeHtml(String(title || '').trim()).replace(/\n/g, '<br>');
        const words = String(prompts || '').trim();
        if (!safeTitle && !words) return '새 문제';
        if (!words) return safeTitle || '새 문제';
        return `${safeTitle}<br>(제시어: <span class='target-word'>${escapeHtml(words)}</span>)`;
    }

    function parseHint(hint) {
        return decodeHtml(String(hint || '')
            .replace(/<b>\s*\[보기\]\s*<\/b>\s*/i, '')
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/<[^>]+>/g, ''))
            .trim();
    }

    function buildHint(text) {
        const plain = String(text || '').trim();
        return plain ? `<b>[보기]</b> ${escapeHtml(plain).replace(/\n/g, '<br>')}` : '';
    }

    function requiredToText(required) {
        return (required || []).map(item => Array.isArray(item) ? item.join(' | ') : item).join('\n');
    }

    function textToRequired(text) {
        return text.split('\n').map(line => line.trim()).filter(Boolean).map(line => {
            if (line.includes('|')) return line.split('|').map(part => part.trim()).filter(Boolean);
            return line;
        });
    }

    function textToList(text) {
        return text.split('\n').map(line => line.trim()).filter(Boolean);
    }

    function allImageOptions() {
        const names = new Set(IMAGE_OPTIONS.concat(extraImages));
        stages.forEach(stage => {
            (stage.questions || []).forEach(question => {
                if (question.img) names.add(question.img);
            });
        });
        return [''].concat([...names].filter(Boolean));
    }

    function getFunctionUrl(name) {
        if (window.KOREAN_QUEST_PUBLISH_URL && name === 'publish') return window.KOREAN_QUEST_PUBLISH_URL;
        if (location.hostname.endsWith('netlify.app')) return '/.netlify/functions/' + name;
        return 'https://koreanclallenge.netlify.app/.netlify/functions/' + name;
    }

    function levelLabel(level) {
        if (level === 'intermediate' || level === '중급') return '중급';
        if (level === 'advanced' || level === '고급') return '고급';
        return '초급';
    }

    function escapeHtml(value) {
        return String(value || '').replace(/[&<>"']/g, ch => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
    }

    function renderEditor() {
        const stage = stages[currentStage];
        if (!stage || stageLevelOf(stage) !== currentAdminLevel) {
            document.getElementById('editor-title').innerText = levelLabel(currentAdminLevel) + ' 편집';
            document.getElementById('stage-editor').innerHTML = '<p class="muted">이 난이도에 스테이지가 없습니다. 왼쪽에서 스테이지를 추가해 주세요.</p>';
            return;
        }
        if (currentQuestion >= stage.questions.length) currentQuestion = 0;
        const question = stage.questions[currentQuestion] || blankQuestion();
        const parsed = parseQuestionHtml(question.q);
        document.getElementById('editor-title').innerText = stage.stage + ' 편집';
        document.getElementById('stage-editor').innerHTML = `
            <label>스테이지 이름</label>
            <input id="stage-name" value="${escapeHtml(stage.stage)}">
            <label>문법 제목</label>
            <input id="stage-title" value="${escapeHtml(stage.grammarTitle)}">
            <label>마스코트 말</label>
            <input id="stage-speech" value="${escapeHtml(stage.mascotSpeech)}">
            <label>힌트</label>
            <div class="help">학생 화면에 [보기]로 보입니다. 그냥 설명만 적으면 됩니다.</div>
            <textarea id="stage-hint">${escapeHtml(parseHint(stage.hint))}</textarea>
            <div class="row">
                <button class="btn gray" onclick="saveStageMeta()">스테이지 정보 저장</button>
                <button class="btn gray" onclick="moveStage(-1)">위로</button>
                <button class="btn gray" onclick="moveStage(1)">아래로</button>
                <button class="btn red" onclick="deleteStage()">스테이지 삭제</button>
            </div>
            <h3>문제 ${stage.questions.length}개</h3>
            <div>${stage.questions.map((item, index) => `
                <button class="q-item ${index === currentQuestion ? 'active' : ''}" onclick="selectQuestion(${index})">
                    ${index + 1}. ${escapeHtml(parseQuestionHtml(item.q).title || '새 문제')}
                </button>
            `).join('')}</div>
            <div class="row">
                <button class="btn" onclick="addQuestion()">문제 추가</button>
            </div>
            <label>문제</label>
            <div class="help">학생이 보는 질문입니다. 줄을 바꾸면 화면에서도 줄이 바뀝니다.</div>
            <textarea id="q-title" oninput="updateQuestionPreview()">${escapeHtml(parsed.title)}</textarea>
            <label>제시어</label>
            <div class="help">학생에게 노랗게 보여줄 단어입니다. 예: 네팔, 학생</div>
            <input id="q-prompts" value="${escapeHtml(parsed.prompts)}" oninput="updateQuestionPreview()" placeholder="예: 네팔, 학생">
            <label>학생 화면 미리보기</label>
            <div class="preview-box" id="q-preview">${buildQuestionHtml(parsed.title, parsed.prompts)}</div>
            <label>정답</label>
            <div class="help">
                짧은 단어는 <b>한 줄에 하나씩</b> 적으면, 그 말이 모두 들어가야 정답입니다.<br>
                같은 뜻의 다른 표현은 같은 줄에서 <b>|</b> 로 나누세요.<br>
                정답 문장 전체를 허용하려면 문장을 한 줄에 적으세요. 문장 여러 개는 <b>|</b> 로 나누면 됩니다.<br>
                예: <code>네팔</code> 다음 줄 <code>학생</code><br>
                예: <code>저는 네팔 학생이에요 | 전 네팔 학생이에요</code><br>
                예: <code>사요 | 사</code><br>
                기본으로 들어 있는 <b>정답</b>이라는 글자는 지우세요.
            </div>
            <textarea id="q-required">${escapeHtml(requiredToText(question.required))}</textarea>
            <label>오답</label>
            <div class="help">
                학생이 <b>말하면 안 되는 말</b>입니다. 이 말이 들어가면 오답입니다.<br>
                한 줄에 하나씩 적으세요. 비슷한 틀린 표현은 <b>|</b> 로 나누면 됩니다.<br>
                예: <code>입니다</code><br>
                예: <code>저가</code><br>
                예: <code>사어요 | 사어</code>
            </div>
            <textarea id="q-forbidden">${escapeHtml(requiredToText(question.forbidden || []))}</textarea>
            <label>이미지</label>
            <div class="help">있는 그림을 고르거나, 아래 버튼으로 새 사진을 올리면 됩니다. png, jpg만 올리는 게 제일 안전합니다.</div>
            <select id="q-img" onchange="updateImagePreview()">${allImageOptions().map(img => `<option value="${img}" ${question.img === img ? 'selected' : ''}>${img || '(없음)'}</option>`).join('')}</select>
            <input type="file" id="q-img-file" accept="image/png,image/jpeg,image/gif,image/webp" onchange="uploadQuestionImage(this)">
            <img class="img-preview${question.img ? ' show' : ''}" id="q-img-preview" alt="문제 이미지 미리보기" src="${question.img ? escapeHtml(localImagePreview[question.img] || question.img) : ''}">
            <details class="advanced">
                <summary>더 자세한 설정 (필요할 때만)</summary>
                <label>문제 유형</label>
                <select id="q-type">
                    <option value="" ${!question.type ? 'selected' : ''}>(없음)</option>
                    <option value="positive" ${question.type === 'positive' ? 'selected' : ''}>긍정</option>
                    <option value="negative" ${question.type === 'negative' ? 'selected' : ''}>부정</option>
                    <option value="birthday" ${question.type === 'birthday' ? 'selected' : ''}>생일</option>
                </select>
                <label>지시사 보기</label>
                <input id="q-demo" value="${escapeHtml(question.qDemo || '')}" placeholder="예: 이것은">
                <label>조사 검사</label>
                <select id="q-particle">
                    <option value="" ${!question.particleType ? 'selected' : ''}>(없음)</option>
                    <option value="에" ${question.particleType === '에' ? 'selected' : ''}>에</option>
                    <option value="에서" ${question.particleType === '에서' ? 'selected' : ''}>에서</option>
                </select>
            </details>
            <div class="row">
                <button class="btn ok" onclick="saveQuestion()">이 문제 저장</button>
                <button class="btn gray" onclick="moveQuestion(-1)">문제 위로</button>
                <button class="btn gray" onclick="moveQuestion(1)">문제 아래로</button>
                <button class="btn red" onclick="deleteQuestion()">문제 삭제</button>
            </div>
        `;
    }

    function updateQuestionPreview() {
        const preview = document.getElementById('q-preview');
        const title = document.getElementById('q-title');
        const prompts = document.getElementById('q-prompts');
        if (!preview || !title || !prompts) return;
        preview.innerHTML = buildQuestionHtml(title.value, prompts.value);
    }

    function updateImagePreview() {
        const select = document.getElementById('q-img');
        const preview = document.getElementById('q-img-preview');
        if (!select || !preview) return;
        const name = select.value;
        if (!name) {
            preview.classList.remove('show');
            preview.removeAttribute('src');
            return;
        }
        preview.src = localImagePreview[name] || name;
        preview.classList.add('show');
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result || ''));
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    async function uploadQuestionImage(input) {
        const file = input && input.files && input.files[0];
        if (!file) return;
        const password = sessionStorage.getItem('koreanQuestAdminPw') || '';
        if (!password) {
            setSaveStatus('다시 로그인해 주세요.');
            return;
        }
        if (file.size > 1200000) {
            setSaveStatus('이미지가 너무 큽니다. 1.2MB 이하로 줄여 주세요.');
            input.value = '';
            return;
        }
        setSaveStatus('이미지를 올리는 중...');
        try {
            const dataUrl = await fileToBase64(file);
            const res = await fetch(getFunctionUrl('upload-image'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    password,
                    filename: file.name,
                    content: dataUrl
                })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                setSaveStatus('이미지 업로드에 실패했습니다. ' + (data.error || res.statusText));
                input.value = '';
                return;
            }
            extraImages.push(data.filename);
            localImagePreview[data.filename] = dataUrl;
            saveQuestion(true);
            const select = document.getElementById('q-img');
            if (select) {
                if (![...select.options].some(option => option.value === data.filename)) {
                    const option = document.createElement('option');
                    option.value = data.filename;
                    option.textContent = data.filename;
                    select.appendChild(option);
                }
                select.value = data.filename;
            }
            saveQuestion(true);
            updateImagePreview();
            setSaveStatus('이미지를 올렸습니다. 이 문제에 붙였으니 아래 저장 후 GitHub에 게시해 주세요. 그림은 1~2분 뒤 학생 화면에 보입니다.');
        } catch (error) {
            setSaveStatus('이미지를 올리지 못했습니다. 인터넷 연결을 확인해 주세요.');
        }
        input.value = '';
    }

    function saveStageMeta(silent) {
        const stage = stages[currentStage];
        const nameEl = document.getElementById('stage-name');
        if (!stage || !nameEl) return;
        stage.stage = nameEl.value.trim();
        stage.level = currentAdminLevel;
        stage.grammarTitle = document.getElementById('stage-title').value.trim();
        stage.mascotSpeech = document.getElementById('stage-speech').value.trim();
        stage.hint = buildHint(document.getElementById('stage-hint').value);
        if (!silent) {
            renderAll();
            setSaveStatus('스테이지 정보를 반영했습니다. 아래 저장 버튼으로 남겨 주세요.');
        }
    }

    function selectQuestion(index) {
        saveQuestion(true);
        currentQuestion = index;
        renderEditor();
        renderStageList();
    }

    function saveQuestion(silent) {
        const stage = stages[currentStage];
        if (!stage || !stage.questions[currentQuestion]) return;
        if (!document.getElementById('q-title')) return;
        const question = {
            q: buildQuestionHtml(
                document.getElementById('q-title').value,
                document.getElementById('q-prompts').value
            ),
            required: textToRequired(document.getElementById('q-required').value)
        };
        const forbidden = textToRequired(document.getElementById('q-forbidden').value);
        const img = document.getElementById('q-img').value;
        const type = document.getElementById('q-type').value;
        const qDemo = document.getElementById('q-demo').value.trim();
        const particleType = document.getElementById('q-particle').value;
        if (forbidden.length) question.forbidden = forbidden;
        if (img) question.img = img;
        if (type) question.type = type;
        if (qDemo) question.qDemo = qDemo;
        if (particleType) question.particleType = particleType;
        stage.questions[currentQuestion] = question;
        if (!silent) {
            renderAll();
            setSaveStatus('문제를 반영했습니다. 학생에게 보이게 하려면 GitHub에 게시해 주세요.');
        }
    }

    function addQuestion() {
        if (currentStage < 0) return;
        saveQuestion(true);
        stages[currentStage].questions.push(blankQuestion());
        currentQuestion = stages[currentStage].questions.length - 1;
        renderAll();
    }

    function deleteQuestion() {
        if (!confirm('이 문제를 삭제할까요?')) return;
        stages[currentStage].questions.splice(currentQuestion, 1);
        if (!stages[currentStage].questions.length) stages[currentStage].questions.push(blankQuestion());
        currentQuestion = Math.max(0, currentQuestion - 1);
        renderAll();
    }

    function moveQuestion(dir) {
        saveQuestion(true);
        const list = stages[currentStage].questions;
        const next = currentQuestion + dir;
        if (next < 0 || next >= list.length) return;
        [list[currentQuestion], list[next]] = [list[next], list[currentQuestion]];
        currentQuestion = next;
        renderAll();
    }

    function moveStage(dir) {
        saveStageMeta(true);
        const list = stagesOfLevel(currentAdminLevel);
        const pos = list.findIndex(function(item) { return item.index === currentStage; });
        const nextPos = pos + dir;
        if (pos < 0 || nextPos < 0 || nextPos >= list.length) return;
        const from = list[pos].index;
        const to = list[nextPos].index;
        [stages[from], stages[to]] = [stages[to], stages[from]];
        currentStage = to;
        renderAll();
    }

    function deleteStage() {
        if (currentStage < 0) return;
        if (stages.length <= 1) {
            alert('스테이지는 최소 1개가 필요합니다.');
            return;
        }
        if (!confirm('이 스테이지를 삭제할까요?')) return;
        stages.splice(currentStage, 1);
        const remaining = stagesOfLevel(currentAdminLevel);
        currentStage = remaining.length ? remaining[0].index : -1;
        currentQuestion = 0;
        renderAll();
    }

    function currentJSON() {
        saveStageMeta(true);
        saveQuestion(true);
        return JSON.stringify(stages, null, 2);
    }

    function saveLocal() {
        localStorage.setItem('koreanQuestQuestions', currentJSON());
        setSaveStatus('이 기기에 저장했습니다. 게임 화면을 새로고침하면 미리볼 수 있습니다.');
    }

    function clearLocal() {
        localStorage.removeItem('koreanQuestQuestions');
        setSaveStatus('미리보기를 지웠습니다. 이제 공개된 questions.json을 사용합니다.');
    }

    function downloadJSON() {
        const blob = new Blob([currentJSON()], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'questions.json';
        a.click();
        URL.revokeObjectURL(url);
        setSaveStatus('questions.json 파일을 내려받았습니다.');
    }

    async function publishGitHub() {
        const password = sessionStorage.getItem('koreanQuestAdminPw') || '';
        if (!password) {
            setSaveStatus('다시 로그인해 주세요.');
            return;
        }
        setSaveStatus('GitHub에 올리는 중...');
        try {
            const res = await fetch(getFunctionUrl('publish'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    password,
                    questions: JSON.parse(currentJSON())
                })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                setSaveStatus('게시에 실패했습니다. ' + (data.error || res.statusText));
                return;
            }
            localStorage.removeItem('koreanQuestQuestions');
            setSaveStatus('게시에 성공했습니다. 1~2분 뒤 학생 게임에 반영됩니다.');
        } catch (error) {
            setSaveStatus('게시에 실패했습니다. 인터넷 연결을 확인해 주세요.');
        }
    }

    function setSaveStatus(message) {
        document.getElementById('save-status').innerText = message;
    }

    document.getElementById('password').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') login();
    });

    if (sessionStorage.getItem('koreanQuestAdmin') === '1') {
        openApp();
    }
</script>
</body>
</html>
